name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }} (${{ matrix.deps }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The package with its declared dependencies (numpy < 2, pandas < 3), as users install it
          - { python-version: "3.9", deps: declared }
          - { python-version: "3.10", deps: declared }
          - { python-version: "3.11", deps: declared }
          - { python-version: "3.12", deps: declared }
          # numpy < 2 has no wheels for Python >= 3.13, so test against the latest releases
          - { python-version: "3.13", deps: latest }
          - { python-version: "3.14", deps: latest }

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with its declared dependencies
        if: matrix.deps == 'declared'
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest pytest-cov

      - name: Install the latest dependencies
        if: matrix.deps == 'latest'
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas pytest pytest-cov

      - name: Show versions
        run: python -c "import sys, numpy, scipy, pandas; print(sys.version); print('numpy', numpy.__version__, '| scipy', scipy.__version__, '| pandas', pandas.__version__)"

      - name: Run tests
        run: pytest
