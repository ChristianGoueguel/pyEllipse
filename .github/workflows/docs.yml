name: Docs

# Builds the documentation on every pull request, and builds and publishes it to
# GitHub Pages (https://christiangoueguel.com/pyEllipse) on every push to main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install fonts
        # Liberation Sans has the metrics of Arial, the font of the figure style
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation

      - name: Install pyEllipse and the documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . -r docs/requirements.txt

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.33

      - name: Render the documentation
        run: quarto render docs
        env:
          QUARTO_PYTHON: ${{ env.pythonLocation }}/bin/python

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
